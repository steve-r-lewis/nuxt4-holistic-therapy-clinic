[build]
  command = "free -h && ulimit -a && NODE_OPTIONS=--no-deprecation ./node_modules/.bin/nuxt build --verbose; code=$?; echo \"RAW_EXIT_CODE=$code\"; exit $code"
  publish = ".output/public"

[images]
  remote_images = ["https://images.unsplash.com/*"]

[build.environment]
  NODE_VERSION = "20"
  # Required for pnpm stability on Netlify
  PNPM_FLAGS = "--shamefully-hoist"

[functions]
  # Extends timeout for complex Nitro/SQLite initializations
  node_bundler = "esbuild"
  external_node_modules = ["better-sqlite3"]
